# Importa el archivo único de la instalación (si no existe, la app avisa al arrancar)
spring.config.import=optional:file:./config/ferrepos.properties

# ─── JPA / Hibernate ──────────────────────────────────────────────────────────
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# SQL en consola: solo para depurar. En el negocio déjalo en false.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ─── ZONA HORARIA: Sinaloa, México (UTC-7, sin horario de verano) ─────────────
spring.jpa.properties.hibernate.jdbc.time_zone=America/Mazatlan
spring.jackson.time-zone=America/Mazatlan

# ─── FORMATO DE FECHA: DD/MM/YYYY ─────────────────────────────────────────────
spring.jackson.date-format=dd/MM/yyyy HH:mm:ss
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.serialization.fail-on-empty-beans=false

# ─── Swagger ──────────────────────────────────────────────────────────────────
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=alpha
